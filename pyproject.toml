[project]
name = "fmgr"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = []

[dependency-groups]
dev = [
    "mutmut>=3.8.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mutmut]
source_paths = ["fmgr/"]
only_mutate = ["fmgr/file_manager.py"]
pytest_add_cli_args_test_selection = ["tests/"]
